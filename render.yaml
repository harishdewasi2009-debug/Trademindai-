services:
  - type: web
    name: trademindai-fronted
    runtime: static
    staticPublishPath: ./frontend
    headers:
      # HTML revalidates on every visit so new deploys go live immediately.
      - path: /*
        name: Cache-Control
        value: no-cache, must-revalidate
      # Images and icons: cache for a week (faster repeat visits, better LCP).
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=604800
    routes:
      - type: redirect
        source: /trading-tools
        destination: /features/
      - type: redirect
        source: /trust-and-accuracy
        destination: /trust-accuracy/
